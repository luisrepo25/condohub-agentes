[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "condohub-agentes"
version = "0.1.0"
description = "Agentes de CondoHub: misiones con herramientas MCP y confirmación del ADMIN"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",             # cliente de Gestión, Keycloak y n8n (monitoreo, G5)
    "pymongo>=4.7",            # informes y métricas del monitoreo
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]